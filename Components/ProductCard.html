<template>
  <div
    class="product-card w-72 bg-white rounded-xl shadow-lg overflow-hidden relative hover:shadow-2xl transition-all duration-500 transform hover:-translate-y-2 border border-gray-100 flex flex-col"
  >

    <!-- Discount Badge -->
    <div
      v-if="product.formData.discount && product.formData.discount > 0"
      class="absolute top-2 right-2 bg-gradient-to-r from-red-500 to-pink-500 text-white px-2 py-1 rounded-full text-[10px] font-bold z-20 shadow-lg animate-pulse"
    >
      {{ product.formData.discount }}% OFF
    </div>

    <!-- Section Badge -->
    <div
      v-if="product.formData.section && product.formData.section !== 'Not set'"
      class="absolute top-2 left-2 bg-gradient-to-r from-blue-500 to-purple-500 text-white px-2 py-1 rounded-full text-[10px] font-semibold z-10 shadow-md"
      :class="{'left-14': isEditMode}"
    >
      {{ product.formData.section }}
    </div>

    <!-- Product Image -->
    <div
      class="relative h-48 overflow-hidden cursor-pointer group"
      @click="handleCardClick"
    >
      <img
        :src="getProductImage()"
        :alt="product.formData.title || 'Product Image'"
        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"
      ></div>

      <!-- Quick View Button -->
      <div
        class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300"
      >
        <button
          class="bg-white/90 backdrop-blur-sm text-gray-800 px-4 py-2 rounded-full text-sm font-semibold shadow-lg hover:bg-white transform translate-y-4 group-hover:translate-y-0 transition-all duration-300"
        >
          Quick View
        </button>
      </div>
    </div>

    <!-- Product Info -->
    <div class="p-4 flex-grow">
      <!-- Category -->
      <div v-if="product.formData.category" class="mb-2">
        <span
          class="text-[10px] bg-gradient-to-r from-blue-100 to-purple-100 text-blue-700 px-2 py-0.5 rounded-full font-medium"
        >
          {{ product.formData.category }}
        </span>
      </div>

      <!-- Title -->
      <h3
        class="text-base font-bold text-gray-900 mb-2 cursor-pointer hover:text-blue-600 transition-colors line-clamp-2"
        @click="handleCardClick"
      >
        {{ product.formData.title || 'Untitled Product' }}
      </h3>

      <!-- Description -->
      <p
        v-if="product.formData.description"
        class="text-xs text-gray-600 mb-3 line-clamp-2 leading-relaxed"
      >
        {{ product.formData.description }}
      </p>

      <!-- Price Section -->
      <div class="flex items-center gap-2 mb-3">
        <template v-if="product.formData.price">
          <span class="text-lg font-bold text-gray-900">
            {{ formatPrice(calculateFinalPrice()) }}
          </span>
          <span
            v-if="product.formData.discount && product.formData.discount > 0"
            class="text-xs text-gray-500 line-through"
          >
            {{ formatPrice(product.formData.price) }}
          </span>
          <span
            v-if="product.formData.discount && product.formData.discount > 0"
            class="text-[10px] text-green-600 font-semibold"
          >
            Save {{ formatPrice(product.formData.price - calculateFinalPrice()) }}
          </span>
        </template>

        <!-- Fallback if price not set -->
        <template v-else>
          <span class="text-sm font-semibold text-gray-500 italic">
            Price Available on Request
          </span>
        </template>
      </div>

      <!-- Tags -->
      <div v-if="getTags().length > 0" class="flex flex-wrap gap-1.5 mb-3">
        <span
          v-for="tag in getTags().slice(0, 3)"
          :key="tag"
          class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium hover:bg-blue-100 hover:text-blue-600 transition-colors"
        >
          {{ tag }}
        </span>
        <span
          v-if="getTags().length > 3"
          class="text-[10px] text-gray-500 px-2 py-0.5"
        >
          +{{ getTags().length - 3 }} more
        </span>
      </div>

      <!-- Features -->
      <div v-if="getFeatures().length > 0" class="mb-3">
        <ul class="text-xs text-gray-600 space-y-0.5">
          <li
            v-for="feature in getFeatures().slice(0, 2)"
            :key="feature"
            class="flex items-center gap-1.5"
          >
            <svg
              class="w-3 h-3 text-green-500 flex-shrink-0"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              ></path>
            </svg>
            <span class="truncate">{{ feature }}</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="px-4 pb-4 mt-auto flex flex-col gap-2 sm:flex-row sm:gap-2 sm:justify-between sm:items-center">
      <!-- Telegram Button -->
      <a
        v-if="product.formData.telegramUsername"
        :href="`https://t.me/${product.formData.telegramUsername}`"
        target="_blank"
        class="w-full sm:w-1/3 flex items-center justify-center gap-1.5 bg-gradient-to-r from-blue-600 to-blue-700 text-white py-2 px-3 rounded-lg hover:from-blue-700 hover:to-blue-800 transition-all duration-300 text-xs font-semibold shadow-md hover:shadow-lg transform hover:scale-105"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M9.743 13.334l-.387 5.478c.554 0 .794-.24 1.09-.527l2.615-2.48 5.418 3.96c.993.547 1.703.26 1.965-.92l3.563-16.718v-.001c.32-1.508-.547-2.096-1.538-1.736L.92 9.477c-1.48.567-1.465 1.377-.25 1.744l5.485 1.712L18.558 5.71c.555-.362 1.057-.162.642.2L9.743 13.334z" />
        </svg>
        Telegram
      </a>

      <!-- WhatsApp Button -->
      <a
        :href="getWhatsAppLink()"
        target="_blank"
        class="w-full sm:w-1/3 flex items-center justify-center gap-1.5 bg-gradient-to-r from-green-500 to-green-600 text-white py-2 px-3 rounded-lg hover:from-green-600 hover:to-green-700 transition-all duration-300 text-xs font-semibold shadow-md hover:shadow-lg transform hover:scale-105"
        @click.stop
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347M12.051 21.785h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26C2.17 5.814 6.605 1.38 12.057 1.38c2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884M20.464 3.488A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        WhatsApp
      </a>

      <!-- Call Button -->
      <a
        v-if="product.formData.phoneNumber"
        :href="`tel:${product.formData.phoneNumber}`"
        class="w-full sm:w-1/3 flex items-center justify-center gap-1.5 bg-gradient-to-r from-yellow-500 to-yellow-600 text-white py-2 px-3 rounded-lg hover:from-yellow-600 hover:to-yellow-700 transition-all duration-300 text-xs font-semibold shadow-md hover:shadow-lg transform hover:scale-105"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.86 19.86 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.86 19.86 0 013.08 4.18 2 2 0 015.06 2h3a2 2 0 012 1.72c.12.81.38 1.6.77 2.33a2 2 0 01-.45 2.18l-1.27 1.27a16 16 0 006 6l1.27-1.27a2 2 0 012.18-.45 11.72 11.72 0 002.33.77A2 2 0 0122 16.92z"/>
        </svg>
        Call Now
      </a>
    </div>
  </div>
</template>

<script>
  Vue.component("product-card", {
    props: {
      product: {
        type: Object,
        required: true,
      },
      isEditMode: {
        type: Boolean,
        default: false,
      },
    },
    data() {
      return {};
    },
    computed: {
      settings() {
        return this.$store.state.settings;
      },
    },
    methods: {
      // Generate thumbnail URL for product image
      getThumbnailUrl(fileId, size = "w400") {
        if (!fileId) return null;
        return (
          "https://drive.google.com/thumbnail?id=" + fileId + "&sz=" + size
        );
      },

      // Calculate final price with discount
      calculateFinalPrice() {
        const price = parseFloat(this.product.formData.price) || 0;
        const discount = parseInt(this.product.formData.discount) || 0;
        return price * (1 - discount / 100);
      },

      // Format price for display
      formatPrice(price) {
        const currency = this.$store.state.settings.currency;
        const locale = this.$store.state.settings.locale;
        return new Intl.NumberFormat(locale, {
          style: "currency",
          currency: currency,
        }).format(price);
      },

      // Get product image URL
      getProductImage() {
        if (this.product.formData.image && this.product.formData.image.fileId) {
          return this.getThumbnailUrl(
            this.product.formData.image.fileId,
            "w400"
          );
        }
        // Fallback to placeholder image
        return "https://via.placeholder.com/400x300/e5e7eb/6b7280?text=No+Image";
      },

      // Handle edit button click
      handleEditClick(event) {
        event.stopPropagation();
        this.$emit("edit-product", this.product);
      },

      // Handle card click for product details
      handleCardClick() {
        this.$emit("view-details", this.product);
      },

      // Get features array
      getFeatures() {
        return Array.isArray(this.product.formData.features)
          ? this.product.formData.features
          : [];
      },

      // Get tags array
      getTags() {
        return Array.isArray(this.product.formData.tags)
          ? this.product.formData.tags
          : [];
      },

      // Generate WhatsApp chat link with product details
      getWhatsAppLink() {
        const productTitle = this.product.formData.title || "Untitled Product";
        const price = this.formatPrice(this.calculateFinalPrice());

        const message =
          "Hi! I'm interested in:\n\n*" + productTitle + "*\nPrice: " + price;

        // 🔁 Dynamically use phone number from the form
        const phoneNumber = this.product.formData.whatsappPhone || "+251953115473";

        const encodedMessage = encodeURIComponent(message);

        return "https://wa.me/" + phoneNumber + "?text=" + encodedMessage;
      },
    },
    template: document.currentScript.previousElementSibling.innerHTML,
  });
</script>
