<script>
  // Define Settings component
  const Settings = {
    name: "Settings",
    data() {
      return {
        newTag: "",
        settings: {
          siteName: "",
          siteLogo: "",
          deployedSiteUrl: "",
          locale: "en-US",
          currency: "USD",
          companyDescription: "",
          socialMedia: {
            twitter: "",
            facebook: "",
            instagram: "",
            pinterest: "",
          },
          quickLinks: ["", "", "", "", ""],
          categories: [""],
          tags: [],
          contact: {
            phone: "",
            email: "",
            address: {
              street: "",
              city: "",
              state: "",
              zipCode: "",
              country: "",
            },
          },
          footerLinks: {
            privacyPolicy: "",
            termsOfService: "",
            cookiePolicy: "",
          },
          heroTitle: "",
          heroSubtitle: "",
        },
      };
    },
    methods: {
      loadSettings() {
        google.script.run
          .withSuccessHandler((data) => {
            if (data) {
              const parsedData = JSON.parse(data);
              // Merge loaded data with default structure
              this.settings = {
                ...this.settings,
                ...parsedData,
              };

              // Ensure contact structure exists
              if (!this.settings.contact) {
                this.settings.contact = {
                  phone: "",
                  email: "",
                  address: {
                    street: "",
                    city: "",
                    state: "",
                    zipCode: "",
                    country: "",
                  },
                };
              } else if (!this.settings.contact.address) {
                // Add address structure if it doesn't exist
                this.settings.contact.address = {
                  street: "",
                  city: "",
                  state: "",
                  zipCode: "",
                  country: "",
                };
              }
            }
          })
          .withFailureHandler((err) => {
            console.error("Error loading settings:", err);
          })
          .getSiteSettings();
      },
      saveSettings() {
        google.script.run
          .withSuccessHandler(() => {
            alert("Settings saved successfully!");
          })
          .withFailureHandler((err) => {
            alert("Error saving settings: " + err.message);
            console.error("Error saving settings:", err);
          })
          .saveSiteSettings(JSON.stringify(this.settings));
      },
      addCategory() {
        this.settings.categories.push("");
      },
      removeCategory(index) {
        this.settings.categories.splice(index, 1);
      },
      addTag() {
        if (
          this.newTag.trim() &&
          !this.settings.tags.includes(this.newTag.trim())
        ) {
          this.settings.tags.push(this.newTag.trim());
          this.newTag = "";
        }
      },
      removeTag(index) {
        this.settings.tags.splice(index, 1);
      },
    },
    created() {
      this.loadSettings();
    },
    template: document.currentScript.previousElementSibling.innerHTML,
  };
</script>
