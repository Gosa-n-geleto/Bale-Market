          </button>

        <!-- Related Tags Section -->

          v-if="tagProducts.length > 0 && relatedTags.length > 0"
          class="mt-16 pt-16 border-t border-gray-200"
        >
          <h3 class="text-2xl font-bold text-gray-900 mb-8 text-center">
            Related Tags
          </h3>
          <div class="flex flex-wrap justify-center gap-3">
            <button
              v-for="relatedTag in relatedTags.slice(0, 10)"
              :key="relatedTag"
              @click="navigateToTag(relatedTag)"
              class="px-4 py-2 bg-gray-100 hover:bg-blue-100 text-gray-700 hover:text-blue-700 rounded-full text-sm font-medium transition-colors"
            >
              {{ relatedTag }}
            </button>
          </div>

<script>
  const TagProducts = {
    name: "TagProducts",
    data() {
      return {
        tagName: "",
        products: [],
        loading: false,
        error: null,
        selectedProduct: {},
        isDrawerOpen: false,
      };
    },
    computed: {
      settings() {
        return this.$store.state.settings;
      },
      tagProducts() {
        if (!this.tagName || !this.products.length) return [];

        return this.products.filter((product) => {
          if (!product.formData.tags) return false;
          console.log("product.formData.tags", product.formData.tags);
          // Split tags by comma and check if any matches
          const productTags = product.formData.tags.map((tag) =>
            tag.trim().toLowerCase()
          );

          return productTags.includes(this.tagName.toLowerCase());
        });
      },
      relatedTags() {
        if (!this.tagProducts.length) return [];

        const allTags = new Set();

        this.tagProducts.forEach((product) => {
          if (product.formData.tags) {
            product.formData.tags.forEach((tag) => {
              const cleanTag = tag.trim();
              if (
                cleanTag &&
                cleanTag.toLowerCase() !== this.tagName.toLowerCase()
              ) {
                allTags.add(cleanTag);
              }
            });
          }
        });

        return Array.from(allTags);
      },
      siteLogo() {
        if (!this.settings || !this.settings.siteLogo) {
          return "";
        }
        return this.$store.transformToThumbnail(this.settings.siteLogo);
      },
    },
    watch: {
      $route(to, from) {
        this.tagName = to.params.tag || "";
        if (this.tagName) {
          this.fetchProducts();
        }
      },
    },
    created() {
      this.tagName = this.$route.params.tag || "";
      console.log("TagProducts component created for tag:", this.tagName);
      // Ensure store is initialized
      if (
        !this.$store.state.settings ||
        Object.keys(this.$store.state.settings).length === 0
      ) {
        this.$store.dispatch("initializeData");
      }
    },
    mounted() {
      this.fetchProducts();
    },
    methods: {
      transformToThumbnail(url, size = "w100") {
        if (!url) return "";

        // If already a thumbnail URL, return as is
        if (url.includes("drive.google.com/thumbnail")) {
          return url;
        }

        // Extract file ID from various Google Drive URL formats
        let fileId = "";

        // Format: https://drive.google.com/file/d/FILE_ID/view
        const fileMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (fileMatch) {
          fileId = fileMatch[1];
        }

        // Format: https://drive.google.com/open?id=FILE_ID
        const openMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (openMatch) {
          fileId = openMatch[1];
        }

        // Format: https://drive.google.com/uc?id=FILE_ID
        const ucMatch = url.match(/uc\?id=([a-zA-Z0-9_-]+)/);
        if (ucMatch) {
          fileId = ucMatch[1];
        }

        // If we found a file ID, return thumbnail URL
        if (fileId) {
          return (
            "https://drive.google.com/thumbnail?id=" + fileId + "&sz=" + size
          );
        }

        // If no Google Drive format detected, return original URL
        return url;
      },
      async fetchProducts() {
        this.loading = true;
        this.error = null;
        try {
          this.products = this.$store.state.products || [];
          if (this.products.length === 0) {
            await this.$store.dispatch("initializeData");
            this.products = this.$store.state.products || [];
          }
          this.loading = false;
        } catch (error) {
          this.loading = false;
          this.error = "Error: " + error.message;
        }
      },
      goBack() {
        this.$router.go(-1);
      },
      navigateToTag(tag) {
        this.$router.push("/tag/" + encodeURIComponent(tag));
      },
      handleEditProduct(product) {
        this.selectedProduct = { ...product };
        this.isDrawerOpen = true;
      },
      closeDrawer() {
        this.isDrawerOpen = false;
      },
      handleSave(formData) {
        this.closeDrawer();
        this.fetchProducts();
      },
      handleViewDetails(product) {
        console.log(
          "TagProducts: handleViewDetails called for product:",
          product
        );
        this.$store.dispatch("openProductModal", product);
      },
    },
    template: document.currentScript.previousElementSibling.innerHTML,
  };
</script>
