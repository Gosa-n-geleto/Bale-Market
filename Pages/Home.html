<script>
  const Home = {
    name: "Home",
    data() {
      return {
        selectedProduct: {
          title: "",
          description: "",
          mrp: "",
          discount: "",
          tags: "",
          features: "",
        },
        isDrawerOpen: false,
        loading: false,
        error: null,
        newsletterEmail: "",
        newsletterLoading: false,
        newsletterSuccess: false,
        newsletterError: false,
        newsletterMessage: "",
        selectedCategory: null,
      };
    },
    created() { },
    mounted() { },
    methods: {
      handleEditProduct(product) {
        this.selectedProduct = { ...product };
        this.isDrawerOpen = true;
      },
      openNewProductDrawer() {
        this.selectedProduct = { name: "", price: "", description: "" };
        this.isDrawerOpen = true;
      },
      closeDrawer() {
        this.isDrawerOpen = false;
      },
      openDrawer() {
        this.isDrawerOpen = true;
      },
      handleSave(formData) {
        this.closeDrawer();
        this.$store.dispatch("initializeData");
      },
      retryFetch() {
        this.$store.dispatch("initializeData");
      },
      handleViewDetails(product) {
        this.$store.dispatch("openProductModal", product);
      },
      handleBuyNow() {
        if (
          this.$store.state.modalProduct &&
          this.$store.state.modalProduct.formData.paymentUrl
        ) {
          window.open(
            this.$store.state.modalProduct.formData.paymentUrl,
            "_blank"
          );
          this.$store.dispatch("closeProductModal");
        }
      },
      onCategorySelected(category) {
        this.$router.push("/category/" + encodeURIComponent(category));
      },
      navigateToTag(tag) {
        this.$router.push("/tag/" + encodeURIComponent(tag));
      },
      onCategoryFilterSelected(category) {
        this.selectedCategory = category;
      },
      scrollToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      },
      getQuickLinkText(quickLink) {
        if (!quickLink || typeof quickLink !== "string") return "";
        const parts = quickLink.split(":");
        return parts[0] || "";
      },
      getQuickLinkPage(quickLink) {
        if (!quickLink || typeof quickLink !== "string") return "";
        const parts = quickLink.split(":");
        return parts[1] || "";
      },
    },
    computed: {
      products() {
        return this.$store.state.products;
      },
      settings() {
        return this.$store.state.settings;
      },
      featuredProducts() {
        let products = this.products.filter(
          (p) => p.formData.section === "Featured"
        );

        // Apply category filter if selected
        if (this.selectedCategory) {
          products = products.filter(
            (p) => p.formData.category === this.selectedCategory
          );
        }

        return products
          .sort((a, b) => (a.formData.rank || 0) - (b.formData.rank || 0))
          .slice(0, 8);
      },
      recentProducts() {
        let products = this.products.filter((p) => {
          if (!p.formData.dateAdded) return false;
          const addedDate = new Date(p.formData.dateAdded);
          const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
          return addedDate > thirtyDaysAgo;
        });

        return products
          .sort(
            (a, b) =>
              new Date(b.formData.dateAdded) - new Date(a.formData.dateAdded)
          )
          .slice(0, 8);
      },
      heroProducts() {
        return this.products
          .filter((p) => p.formData.section === "Hero")
          .sort((a, b) => (a.formData.rank || 0) - (b.formData.rank || 0))
          .slice(0, 4);
      },
      siteLogo() {
        if (!this.settings || !this.settings.siteLogo) {
          return "";
        }
        return this.$store.transformToThumbnail(this.settings.siteLogo);
      },
      filteredQuickLinks() {
        if (!this.settings || !this.settings.quickLinks) {
          return [];
        }
        // Filter out any "Back to Top" entries (check both display text and page parameter)
        return this.settings.quickLinks.filter((link) => {
          const linkText = this.getQuickLinkText(link).toLowerCase();
          const linkPage = this.getQuickLinkPage(link);
          return linkText !== "back to top" && linkPage !== "home";
        });
      },
      hasAddress() {
        if (!this.settings || !this.settings.contact || !this.settings.contact.address) {
          return false;
        }
        const address = this.settings.contact.address;
        return address.street || address.city || address.state || address.zipCode || address.country;
      },
    },
    template: document.currentScript.previousElementSibling.innerHTML,
  };
</script>
