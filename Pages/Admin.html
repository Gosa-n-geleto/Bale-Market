<template>
  <div class="min-h-screen bg-gray-50">
    <div class="admin-page p-6">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Products</h1>
        <button @click="addNewProduct"
          class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
          Add New Product
        </button>
      </div>

      <!-- Message -->
      <div v-if="message" class="mb-4 p-4 rounded-lg"
        :class="messageType === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
        {{ message }}
      </div>

      <!-- Search -->
      <div class="mb-6">
        <input v-model="searchQuery" type="text" placeholder="Search products..."
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
      </div>

      <!-- Add/Edit Modal -->
      <global-modal :is-open="showAddForm" :title="editingProduct ? 'Edit Product' : 'Add New Product'"
        :show-footer="false" @close="cancelAdd">
        <div class="h-full overflow-y-auto">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Title *</label>
              <input v-model="formData.title" type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Product title" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Price</label>
              <input v-model="formData.price" type="number" step="0.01"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="0.00" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Discount (%)</label>
              <input v-model="formData.discount" type="number" min="0" max="100" step="1"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="0" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
              <select v-model="formData.category"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">Select a category</option>
                <option v-for="category in settings.categories" :key="category" :value="category">
                  {{ category }}
                </option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Tags</label>
              <div class="relative tags-dropdown-container">
                <div @click="toggleTagsDropdown"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer flex justify-between items-center">
                  <div class="flex flex-wrap gap-1">
                    <span v-for="tag in formData.tags" :key="tag"
                      class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full flex items-center gap-1">
                      {{ tag }}
                      <button @click.stop="removeTag(tag)" class="text-blue-600 hover:text-blue-800">
                        ×
                      </button>
                    </span>
                    <span v-if="formData.tags.length === 0" class="text-gray-500">Select tags...</span>
                  </div>
                  <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </div>
                <div v-show="showTagsDropdown"
                  class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto"
                  @click.stop>
                  <div v-for="tag in settings.tags" :key="tag" @click="toggleTag(tag)"
                    class="px-3 py-2 hover:bg-gray-100 cursor-pointer flex items-center">
                    <input type="checkbox" :checked="formData.tags.includes(tag)" class="mr-2"
                      @click.stop="toggleTag(tag)" />
                    {{ tag }}
                  </div>
                </div>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Rank (for ordering)</label>
              <input v-model="formData.rank" type="number" min="0"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="0" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Date Added</label>
              <input v-model="formData.dateAdded" type="date"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Section</label>
              <select v-model="formData.section"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="Not set">Not set</option>
                <option value="New Arrivals">New Arrivals</option>
                <option value="Featured">Featured</option>
                <option value="Hero">Hero</option>
                <option value="Best Sellers">Best Sellers</option>
                <option value="Sale">Sale</option>
                <option value="Trending">Trending</option>
              </select>
            </div>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Telegram Username
            </label>
            <input
              v-model="formData.telegramUsername"
              type="text"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="e.g. InfoTechSupport"
            />
            <p class="text-xs text-gray-500 mt-1">Don't include the @ sign.</p>
          </div>
          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              WhatsApp Phone Number
            </label>
            <input
              v-model="formData.whatsappPhone"
              type="tel"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="e.g. 251912345678"
            />
            <p class="text-xs text-gray-500 mt-1">
              Enter phone number with country code (no + sign)
            </p>
          </div>
          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Phone Number (for call)
            </label>
            <input
              v-model="formData.phoneNumber"
              type="tel"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
              placeholder="e.g. 0912345678"
            />
            <p class="text-xs text-gray-500 mt-1">Include your mobile number for direct calls</p>
          </div>

          <!-- Image Upload Section -->
          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Product Image</label>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-4">
              <!-- Image Preview -->
              <div v-if="formData.image && formData.image.fileId" class="mb-4">
                <div class="relative inline-block">
                  <img :src="getThumbnailUrl(formData.image.fileId, 'w200')" :alt="formData.image.fileName"
                    class="w-32 h-32 object-cover rounded-lg border" />
                  <button @click="removeImage" type="button"
                    class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600">
                    ×
                  </button>
                </div>
                <p class="text-sm text-gray-600 mt-2">
                  {{ formData.image.fileName }}
                </p>
              </div>

              <!-- Upload Area -->
              <div v-if="!formData.image || !formData.image.fileId" class="text-center">
                <input ref="imageInput" type="file" accept="image/*" @change="handleImageUpload" class="hidden" />
                <button @click="$refs.imageInput.click()" type="button" :disabled="imageUploading"
                  class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">
                  {{ imageUploading ? 'Uploading...' : 'Choose Image' }}
                </button>
                <p class="text-sm text-gray-500 mt-2">
                  Upload a product image (JPG, PNG, GIF - Max 5MB)
                </p>
              </div>

              <!-- Upload Progress -->
              <div v-if="imageUploading" class="mt-4">
                <div class="bg-gray-200 rounded-full h-2">
                  <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 50%"></div>
                </div>
                <p class="text-sm text-gray-600 mt-1 text-center">
                  Uploading image...
                </p>
              </div>
            </div>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
            <textarea v-model="formData.description" rows="3"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Product description"></textarea>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Features (one per line)</label>
            <textarea v-model="formData.features" rows="4"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Feature 1\nFeature 2\nFeature 3"></textarea>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Specifications (one per line)</label>
            <textarea v-model="formData.specs" rows="4"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Spec 1\nSpec 2\nSpec 3"></textarea>
          </div>

          <div class="mt-6 flex gap-2 justify-end">
            <button @click="cancelAdd"
              class="bg-gray-600 text-white px-6 py-2 rounded-lg hover:bg-gray-700 transition-colors">
              Cancel
            </button>
            <button @click="saveProduct" :disabled="loading"
              class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
              {{ loading ? 'Saving...' : (editingProduct ? 'Update Product' :
              'Create Product') }}
            </button>
          </div>
        </div>
      </global-modal>

      <!-- Products List -->
      <div class="bg-white rounded-lg shadow-md">
        <div class="p-4 border-b">
          <h2 class="text-xl font-semibold">
            Products ({{ filteredProducts.length }})
          </h2>
        </div>

        <div v-if="loading" class="p-6 text-center">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
          <p class="mt-2 text-gray-600">Loading products...</p>
        </div>

        <div v-else-if="filteredProducts.length === 0" class="p-6 text-center text-gray-500">
          No products found. Add your first product to get started!
        </div>

        <div v-else class="divide-y divide-gray-200">
          <div v-for="product in filteredProducts" :key="product.id" class="p-4 hover:bg-gray-50">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <div class="flex items-start gap-4">
                  <!-- Product Image -->
                  <div v-if="product.formData.image && product.formData.image.fileId" class="flex-shrink-0">
                    <img :src="getThumbnailUrl(product.formData.image.fileId, 'w200')"
                      :alt="product.formData.image.fileName" class="w-32 h-32 object-cover rounded-lg border" />
                  </div>
                  <div v-else class="flex-shrink-0">
                    <div class="w-16 h-16 bg-gray-200 rounded-lg border flex items-center justify-center">
                      <span class="text-gray-400 text-xs">No Image</span>
                    </div>
                  </div>

                  <!-- Product Details -->
                  <div class="flex-1">
                    <h3 class="text-lg font-medium text-gray-900 mb-2">
                      {{ product.formData.title || 'Untitled Product' }}
                    </h3>
                    <div v-if="product.formData.description" class="mt-2 mb-2 text-sm text-gray-600">
                      <span class="font-medium">Description:</span> {{
                      product.formData.description }}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-600">
                      <div>
                        <span class="font-medium">ID:</span> {{ product.id }}
                      </div>
                      <div>
                        <span class="font-medium">Price:</span>
                        {{ product.formData.price ? '$' + product.formData.price
                        : 'Not set' }}
                      </div>
                      <div>
                        <span class="font-medium">Discount:</span>
                        {{ product.formData.discount ? product.formData.discount
                        + '%' : 'Not set' }}
                      </div>
                      <div>
                        <span class="font-medium">Category:</span>
                        {{ product.formData.category || 'Not set' }}
                      </div>
                      <div>
                        <span class="font-medium">Rank:</span>
                        {{ product.formData.rank || 0 }}
                      </div>
                      <div>
                        <span class="font-medium">Section:</span>
                        <span class="inline-block px-2 py-1 text-xs rounded"
                          :class="getSectionBadgeClass(product.formData.section)">
                          {{ product.formData.section || 'Not set' }}
                        </span>
                      </div>
                      <div>
                        <span class="font-medium">Date Added:</span>
                        {{ formatDate(product.formData.dateAdded) }}
                      </div>
                    </div>

                    <div v-if="product.formData.tags && product.formData.tags.length" class="mt-2">
                      <span class="text-xs text-gray-500">Tags:</span>
                      <span v-for="tag in product.formData.tags" :key="tag"
                        class="inline-block bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded ml-1">
                        {{ tag }}
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="flex gap-2 ml-4">
                <button @click="editProduct(product)"
                  class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition-colors">
                  Edit
                </button>
                <button @click="deleteProduct(product)"
                  class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700 transition-colors">
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  const Admin = {
    name: "Admin",
    data() {
      return {
        products: [],
        loading: false,
        showAddForm: false,
        editingProduct: null,
        searchQuery: "",
        settings: {
          categories: [],
          tags: [],
        },
        formData: {
          title: "",
          description: "",
          price: "",
          category: "",
          image: null,
          tags: [],
          features: "",
          dateAdded: "",
          rank: 0,
          paymentUrl: "",
          section: "Not set",
          discount: 0,
          specs: "",
        },
        message: "",
        messageType: "success",
        imageUploading: false,
        showTagsDropdown: false,
      };
    },
    computed: {
      filteredProducts() {
        if (!this.searchQuery) return this.products.reverse();
        return this.products.filter((product) => {
          const searchText = JSON.stringify(product.formData).toLowerCase();
          return searchText.includes(this.searchQuery.toLowerCase());
        }).reverse();
      },
    },
    methods: {
      async loadProducts() {
        this.loading = true;
        try {
          google.script.run
            .withSuccessHandler((result) => {
              this.loading = false;
              if (result.success) {
                this.products = result.products;
              } else {
                this.showMessage(
                  "Error loading products: " + result.error,
                  "error"
                );
              }
            })
            .withFailureHandler((error) => {
              this.loading = false;
              this.showMessage("Error loading products: " + error, "error");
            })
            .getAllProducts();
        } catch (error) {
          this.loading = false;
          this.showMessage("Error loading products: " + error, "error");
        }
      },

      async saveProduct() {
        if (!this.formData.title.trim()) {
          this.showMessage("Title is required", "error");
          return;
        }

        this.loading = true;

        // Prepare form data
        const productData = {
          ...this.formData,
          tags: this.formData.tags || [], // Ensure tags is always an array
          features: this.formData.features
            ? this.formData.features.split("\n").map((f) => f.trim())
            : [],
          specs: this.formData.specs
            ? this.formData.specs.split("\n").map((s) => s.trim())
            : [],
          price: parseFloat(this.formData.price) || 0,
          rank: parseInt(this.formData.rank) || 0,
          discount: parseInt(this.formData.discount) || 0,
          dateAdded:
            this.formData.dateAdded || new Date().toISOString().split("T")[0],
        };

        try {
          if (this.editingProduct) {
            // Update existing product
            google.script.run
              .withSuccessHandler((result) => {
                this.loading = false;
                if (result.success) {
                  this.showMessage("Product updated successfully!", "success");
                  this.loadProducts();
                  this.cancelEdit();
                } else {
                  this.showMessage(
                    "Error updating product: " + result.error,
                    "error"
                  );
                }
              })
              .withFailureHandler((error) => {
                this.loading = false;
                this.showMessage("Error updating product: " + error, "error");
              })
              .updateProduct(this.editingProduct.id, productData);
          } else {
            // Create new product
            google.script.run
              .withSuccessHandler((result) => {
                this.loading = false;
                if (result.success) {
                  this.showMessage("Product created successfully!", "success");
                  this.loadProducts();
                  this.cancelAdd();
                } else {
                  this.showMessage(
                    "Error creating product: " + result.error,
                    "error"
                  );
                }
              })
              .withFailureHandler((error) => {
                this.loading = false;
                this.showMessage("Error creating product: " + error, "error");
              })
              .createProduct(productData);
          }
        } catch (error) {
          this.loading = false;
          this.showMessage("Error saving product: " + error, "error");
        }
      },

      async deleteProduct(product) {
        if (!confirm("Are you sure you want to delete this product?")) {
          return;
        }

        this.loading = true;
        try {
          google.script.run
            .withSuccessHandler((result) => {
              this.loading = false;
              if (result.success) {
                this.showMessage("Product deleted successfully!", "success");
                this.loadProducts();
              } else {
                this.showMessage(
                  "Error deleting product: " + result.error,
                  "error"
                );
              }
            })
            .withFailureHandler((error) => {
              this.loading = false;
              this.showMessage("Error deleting product: " + error, "error");
            })
            .deleteProduct(product.id);
        } catch (error) {
          this.loading = false;
          this.showMessage("Error deleting product: " + error, "error");
        }
      },

      editProduct(product) {
        this.editingProduct = product;
        this.formData = {
          title: product.formData.title || "",
          description: product.formData.description || "",
          price: product.formData.price || "",
          category: product.formData.category || "",
          image: product.formData.image || null,
          tags: Array.isArray(product.formData.tags)
            ? [...product.formData.tags]
            : [],
          features: Array.isArray(product.formData.features)
            ? product.formData.features.join("\n")
            : "",
          dateAdded: product.formData.dateAdded || "",
          rank: product.formData.rank || 0,
          paymentUrl: product.formData.paymentUrl || "",
          section: product.formData.section || "Not set",
          discount: product.formData.discount || 0,
          specs: Array.isArray(product.formData.specs)
            ? product.formData.specs.join("\n")
            : "",
        };
        this.showAddForm = true;
      },

      addNewProduct() {
        this.editingProduct = null;
        const today = new Date().toISOString().split("T")[0];
        this.formData = {
          title: "",
          description: "",
          price: "",
          category: "",
          image: null,
          tags: [],
          features: "",
          dateAdded: today,
          rank: 0,
          paymentUrl: "",
          section: "Not set",
          discount: 0,
          specs: "",
        };
        this.showAddForm = true;
      },

      cancelAdd() {
        this.showAddForm = false;
        this.editingProduct = null;
        this.formData = {
          title: "",
          description: "",
          price: "",
          category: "",
          image: null,
          tags: [],
          features: "",
          dateAdded: "",
          rank: 0,
          paymentUrl: "",
          section: "Not set",
          discount: 0,
          specs: "",
        };
      },

      cancelEdit() {
        this.cancelAdd();
      },

      showMessage(message, type = "success") {
        this.message = message;
        this.messageType = type;
        setTimeout(() => {
          this.message = "";
        }, 5000);
      },

      formatFormData(formData) {
        return JSON.stringify(formData, null, 2);
      },

      async handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Validate file type
        if (!file.type.startsWith("image/")) {
          this.showMessage("Please select a valid image file", "error");
          return;
        }

        // Validate file size (5MB limit)
        if (file.size > 5 * 1024 * 1024) {
          this.showMessage("Image size must be less than 5MB", "error");
          return;
        }

        this.imageUploading = true;

        try {
          const reader = new FileReader();
          reader.onload = (e) => {
            const base64Data = e.target.result;

            // Upload to Google Drive
            google.script.run
              .withSuccessHandler((result) => {
                this.imageUploading = false;
                if (result.success) {
                  this.formData.image = {
                    fileId: result.fileId,
                    fileName: result.fileName,
                  };
                  this.showMessage("Image uploaded successfully!", "success");
                } else {
                  this.showMessage(
                    "Error uploading image: " + result.error,
                    "error"
                  );
                }
                // Clear the file input
                event.target.value = "";
              })
              .withFailureHandler((error) => {
                this.imageUploading = false;
                this.showMessage("Error uploading image: " + error, "error");
                event.target.value = "";
              })
              .uploadImageToDrive(base64Data, file.name, file.type);
          };
          reader.readAsDataURL(file);
        } catch (error) {
          this.imageUploading = false;
          this.showMessage("Error processing image: " + error, "error");
          event.target.value = "";
        }
      },

      removeImage() {
        if (this.formData.image && this.formData.image.fileId) {
          // Optionally delete from Google Drive
          if (confirm("Do you want to delete this image from Google Drive?")) {
            google.script.run
              .withSuccessHandler((result) => {
                if (result.success) {
                  this.showMessage(
                    "Image deleted from Google Drive",
                    "success"
                  );
                } else {
                  this.showMessage(
                    "Error deleting image: " + result.error,
                    "error"
                  );
                }
              })
              .withFailureHandler((error) => {
                this.showMessage("Error deleting image: " + error, "error");
              })
              .deleteImageFromDrive(this.formData.image.fileId);
          }
        }
        this.formData.image = null;
      },

      // Generate thumbnail URL from fileId
      getThumbnailUrl(fileId, size = "w200") {
        if (!fileId) return null;
        return (
          "https://drive.google.com/thumbnail?id=" + fileId + "&sz=" + size
        );
      },

      // Get section badge colors
      getSectionBadgeClass(section) {
        const classes = {
          Featured: "bg-blue-100 text-blue-800",
          "New Arrivals": "bg-green-100 text-green-800",
          Hero: "bg-purple-100 text-purple-800",
          "Best Sellers": "bg-yellow-100 text-yellow-800",
          Sale: "bg-red-100 text-red-800",
          Trending: "bg-orange-100 text-orange-800",
          "Not set": "bg-gray-100 text-gray-800",
        };
        return classes[section] || "bg-gray-100 text-gray-800";
      },

      // Format date for display
      formatDate(dateString) {
        if (!dateString) return "Not set";
        const date = new Date(dateString);
        return date.toLocaleDateString();
      },
      loadSettings() {
        google.script.run
          .withSuccessHandler((data) => {
            if (data) {
              const parsedData = JSON.parse(data);
              this.settings = {
                ...this.settings,
                ...parsedData,
              };
            }
          })
          .withFailureHandler((err) => {
            console.error("Error loading settings:", err);
          })
          .getSiteSettings();
      },

      toggleTagsDropdown() {
        this.showTagsDropdown = !this.showTagsDropdown;
      },

      toggleTag(tag) {
        const index = this.formData.tags.indexOf(tag);
        if (index === -1) {
          this.formData.tags.push(tag);
        } else {
          this.formData.tags.splice(index, 1);
        }
      },

      removeTag(tag) {
        const index = this.formData.tags.indexOf(tag);
        if (index !== -1) {
          this.formData.tags.splice(index, 1);
        }
      },

      // Add click outside handler
      handleClickOutside(event) {
        const dropdownContainer = event.target.closest(
          ".tags-dropdown-container"
        );
        if (this.showTagsDropdown && !dropdownContainer) {
          this.showTagsDropdown = false;
        }
      },
    },
    mounted() {
      this.loadProducts();
      this.loadSettings();
      // Add click outside listener
      document.addEventListener("click", this.handleClickOutside);
    },
    beforeDestroy() {
      // Remove click outside listener
      document.removeEventListener("click", this.handleClickOutside);
    },
    template: document.currentScript.previousElementSibling.innerHTML,
  };
</script>
