    <script>
      const routes = [
        {
          path: "/",
          component: Admin,
          name: "Admin",
        },
        {
          path: "/admin",
          component: Admin,
          name: "Admin",
        },
        {
          path: "/settings",
          component: Settings,
          name: "Settings",
        },
      ];
      const router = new VueRouter({
        routes,
      });

      new Vue({
        el: "#app",
        router,
        data: {
          settings: {
            siteName: "",
            siteLogo: "",
          },
        },
        computed: {
          siteLogo() {
            if (!this.settings || !this.settings.siteLogo) {
              return "";
            }
            return this.transformToThumbnail(this.settings.siteLogo);
          },
        },
        methods: {
          transformToThumbnail(url, size = "w100") {
            if (!url) return "";

            // If already a thumbnail URL, return as is
            if (url.includes("drive.google.com/thumbnail")) {
              return url;
            }

            // Extract file ID from various Google Drive URL formats
            let fileId = "";

            // Format: https://drive.google.com/file/d/FILE_ID/view
            const fileMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (fileMatch) {
              fileId = fileMatch[1];
            }

            // Format: https://drive.google.com/open?id=FILE_ID
            const openMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (openMatch) {
              fileId = openMatch[1];
            }

            // Format: https://drive.google.com/uc?id=FILE_ID
            const ucMatch = url.match(/uc\?id=([a-zA-Z0-9_-]+)/);
            if (ucMatch) {
              fileId = ucMatch[1];
            }

            // If we found a file ID, return thumbnail URL
            if (fileId) {
              return (
                "https://drive.google.com/thumbnail?id=" +
                fileId +
                "&sz=" +
                size
              );
            }

            // If no Google Drive format detected, return original URL
            return url;
          },
          loadSettings() {
            google.script.run
              .withSuccessHandler((data) => {
                if (data) {
                  const parsedData = JSON.parse(data);
                  this.settings = {
                    ...this.settings,
                    ...parsedData,
                  };
                }
              })
              .withFailureHandler((err) => {
                console.error("Error loading settings in admin:", err);
              })
              .getSiteSettings();
          },
        },
        mounted() {
          this.loadSettings();
        },
      });
    </script>
